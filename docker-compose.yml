services:
  #nama services container database
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: harkat_store_db
    ports:
      #FORMATNYA PortKomputerKalian:PortServiceCountainer
      - "5432:5432"
    volumes:
      #menyimpan data database
      - postgres_data_volume:/var/lib/postgresql/data
  #services lainnya

volumes:
  postgres_data_volume: